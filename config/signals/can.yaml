# CAN 신호 정의 단일 원본 (project.md §5).
# 송신 ECU(C), Gateway, IDS, 시험(Python)이 모두 이 파일을 사용한다.
# ID, 범위, 주기, 비트 위치는 모두 프로젝트 선택값이며 제조사 DBC가 아니다.
#
# 신호 type:
#   u8 / i8 / u16be / i16be : byte 위치부터 정수, big-endian
#   flag                    : byte 안의 1-bit
# min/max는 물리값(scale 적용 후). raw = round(물리값 / scale).
# 어떤 signal에도 쓰이지 않는 byte 0~5의 bit는 reserved이며 송신 시 0이어야 한다.

schema: 1

bus:
  name: vehicle_can
  frame: classical          # Classical CAN, 11-bit ID, 최대 8 byte (§5.1)
  bitrate_logical: 500000   # 계산·문서용. vcan/vxcan은 bitrate를 구현하지 않음

protection:                 # §5.2 공통 보호 형식 (byte 6, 7)
  counter: {byte: 6, shift: 4, bits: 4}
  flags: {byte: 6, valid_bit: 3, degraded_bit: 2, fault_bit: 1, reserved_bit: 0}
  crc:
    byte: 7
    poly: 0x1D
    init: 0xFF
    xor_out: 0xFF
    reflect: false          # CRC-8/SAE-J1850 (AUTOSAR Crc_CalculateCRC8와 동일), check("123456789") = 0x4B
    input: id_be16_then_bytes_0_6
  counter_rx:               # 수신 측 counter 판정 (§5.4, §11.2) — 2026-11-02 제안, 팀 확인 필요
    max_delta: 3            # 1: 정상, 2~3: 수락 + (delta-1)개 손실, 0: 중복 거부, 4~15: 점프/역행 거부 후 재동기화

pdus:
  - id: 0x100
    name: PT_EngineStatus
    sender: engine
    period_ms: 10
    dlc: 8
    signals:
      - {name: rpm,            byte: 0, type: u16be, scale: 1,   unit: rpm,  min: 0,     max: 8000}
      - {name: throttle,       byte: 2, type: u8,    scale: 0.5, unit: pct,  min: 0,     max: 100}
      - {name: coolant,        byte: 3, type: i16be, scale: 0.1, unit: degC, min: -40.0, max: 150.0}
      - {name: ignition_on,    byte: 5, bit: 0, type: flag}
      - {name: engine_running, byte: 5, bit: 1, type: flag}
      - {name: fn_degraded,    byte: 5, bit: 2, type: flag}
      - {name: fn_fault,       byte: 5, bit: 3, type: flag}

  - id: 0x110
    name: PT_VehicleDynamics
    sender: brake           # 2026-11-02 결정: 실차처럼 ABS/ESC가 바퀴 속도·가속도 센서로 계산. 이름의 PT_는 기준서 유지
    period_ms: 20
    dlc: 8
    signals:
      - {name: speed,        byte: 0, type: u16be, scale: 0.01, unit: kmh,  min: 0,      max: 250.00}
      - {name: long_accel,   byte: 2, type: i16be, scale: 0.01, unit: mps2, min: -15.00, max: 15.00}
      - {name: direction,    byte: 4, type: u8,    scale: 1,    unit: enum, min: 0,      max: 2}   # 0=standstill 1=forward 2=reverse
      - {name: fn_degraded,  byte: 5, bit: 2, type: flag}
      - {name: fn_fault,     byte: 5, bit: 3, type: flag}

  - id: 0x180
    name: CH_BrakeStatus
    sender: brake
    period_ms: 10
    dlc: 8
    signals:
      - {name: pressure,     byte: 0, type: u16be, scale: 0.1, unit: bar, min: 0, max: 200.0}
      - {name: pedal,        byte: 2, type: u8,    scale: 0.5, unit: pct, min: 0, max: 100}
      - {name: brake_switch, byte: 3, bit: 0, type: flag}
      - {name: abs_active,   byte: 3, bit: 1, type: flag}
      - {name: fn_degraded,  byte: 3, bit: 2, type: flag}
      - {name: fn_fault,     byte: 3, bit: 3, type: flag}

  - id: 0x200
    name: CH_SteeringStatus
    sender: steering
    period_ms: 10
    dlc: 8
    signals:
      - {name: angle,        byte: 0, type: i16be, scale: 0.1, unit: deg,  min: -780.0,  max: 780.0}
      - {name: angle_rate,   byte: 2, type: i16be, scale: 0.1, unit: degs, min: -2000.0, max: 2000.0}
      - {name: assist_torque, byte: 4, type: i8,   scale: 0.1, unit: Nm,   min: -12.0,   max: 12.0}
      - {name: eps_active,   byte: 5, bit: 0, type: flag}
      - {name: fn_degraded,  byte: 5, bit: 2, type: flag}
      - {name: fn_fault,     byte: 5, bit: 3, type: flag}

  # 0x280 PT_TransmissionStatus: actual gear의 R 인코딩이 기준서에서 1단과 겹쳐(§5.3) 팀 확인 대기. 확정 후 추가.
  # 0x600 GW_NetworkHealth: Gateway 송신(Phase 3)이며 byte 배치가 기준서에 없음. Phase 3에서 정의.
